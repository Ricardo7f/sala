<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala de Reunião</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --ink: #14151A;
  --ink-soft: #6B7280;
  --accent: #4F46E5;
  --accent-soft: #EEF0FD;
  --livre: #16A34A;
  --livre-bg: #ECFDF3;
  --parcial: #D97706;
  --parcial-bg: #FFF7E8;
  --ocupado: #DC2626;
  --ocupado-bg: #FEF2F2;
  --border: #E5E7EB;
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: "Sora", sans-serif;
  --font-body: "Manrope", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font-family: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.is-hidden { display: none !important; }

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0.45); }
  70% { box-shadow: 0 0 0 6px rgba(22,163,74,0); }
}

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: 0 1px 2px rgba(15,23,42,0.03), 0 10px 24px rgba(15,23,42,0.05); min-width: 0; max-width: 100%; box-sizing: border-box; }
.btn { border: none; border-radius: var(--radius-sm); padding: 13px 20px; font-weight: 600; font-size: 0.95rem; font-family: var(--font-body); transition: transform .1s ease, box-shadow .15s ease, opacity .15s ease, background-color .15s ease; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #fff; width: 100%; box-shadow: 0 4px 12px rgba(79,70,229,0.28); }
.btn-primary:disabled { opacity: 0.4; box-shadow: none; }
.btn-primary:hover:not(:disabled) { background: #423AD1; transform: translateY(-1px); }
.btn-ghost { background: var(--surface); color: var(--ink-soft); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-secundario { background: var(--ocupado-bg); color: var(--ocupado); border: 1px solid transparent; width: 100%; margin-top: 12px; }
.btn-secundario:hover { background: #FCE1E1; }
.form-msg { min-height: 20px; font-size: 0.85rem; margin: 8px 0 0; }
.form-msg.is-erro { color: var(--ocupado); }
.form-msg.is-ok { color: var(--livre); }

.auth-body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.auth-creditos { margin: 20px 0 0; text-align: center; font-size: 0.75rem; letter-spacing: 0.02em; color: var(--ink-soft, #9a9a9a); }
.auth-wrap { width: 100%; max-width: 400px; border-radius: 20px; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 24px 48px -12px rgba(15,23,42,0.18); }

.plaque { text-align: center; background: var(--surface); padding: 40px 28px 22px; }
.plaque-pin { display: none; }
.plaque-title { font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; margin: 0; color: var(--ink); letter-spacing: -0.01em; }
.plaque-sub { font-family: var(--font-body); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin: 10px 0 0; }
.auth-card { border: none; border-radius: 0; box-shadow: none; background: var(--surface); padding: 6px 28px 28px; }
.tabs { display: flex; gap: 4px; margin-bottom: 22px; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; }
.tab { flex: 1; background: transparent; border: none; padding: 10px; border-radius: 8px; font-weight: 600; font-family: var(--font-body); color: var(--ink-soft); }
.tab.is-active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15,23,42,0.12); }
.auth-form.is-hidden { display: none; }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
.field input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem; font-family: var(--font-body); background: var(--bg); color: var(--ink); }
.field input:focus { border-color: var(--accent); background: var(--surface); }
.link-esqueci-senha { display: block; width: 100%; text-align: center; background: none; border: none; color: var(--accent); font-size: 0.85rem; font-weight: 600; padding: 12px 0 0; }
.link-esqueci-senha:hover { text-decoration: underline; }

.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); color: var(--ink); }
.topbar-brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 10px; }
.pin-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--livre); display: inline-block; animation: pulse-glow 2.4s ease-in-out infinite; }
.topbar-user { display: flex; align-items: center; gap: 14px; font-size: 0.9rem; }
.topbar-user .btn-ghost { padding: 8px 14px; }
.dash-wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; display: flex; flex-direction: column; gap: 16px; }
.cal-slots-row { display: flex; flex-direction: column; gap: 16px; }

@media (min-width: 900px) {
  .dash-wrap { max-width: 1120px; padding-bottom: 80px; }
  .cal-slots-sticky-wrap { position: sticky; top: 128px; }
  .cal-slots-row { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); align-items: start; gap: 20px; }
  .cal-slots-row .calendario-card { min-width: 0; max-height: calc(100vh - 168px); overflow-y: auto; }
  .cal-slots-row .slots-card { max-height: calc(100vh - 168px); display: flex; flex-direction: column; min-width: 0; scroll-margin-top: 100px; }
  .slots-grid { flex: 1 1 auto; min-height: 0; max-height: none; }
}


.minha-reserva-vazia { margin: 0; color: var(--ink-soft); }
.minha-reserva-label { font-family: var(--font-body); font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); display: block; margin-bottom: 10px; }
.reserva-lista { display: flex; flex-direction: column; }
.reserva-atual { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.reserva-atual:last-of-type { padding-bottom: 0; border-bottom: none; }
.reserva-atual-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.reserva-atual-info { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.reserva-atual-data { font-family: var(--font-display); font-weight: 700; font-size: 0.98rem; white-space: nowrap; }
.reserva-atual-horarios { font-family: var(--font-mono); color: var(--ink-soft); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; }
.reserva-atual-aviso { font-size: 0.8rem; color: var(--ink-soft); margin: 12px 0 0; }
.btn-cancelar-dia { flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; border: none; background: var(--ocupado-bg); color: var(--ocupado); font-size: 1rem; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color .12s ease, transform .1s ease; }
.btn-cancelar-dia:hover { background: #FCE1E1; }
.btn-cancelar-dia:active { transform: scale(0.94); }
.reserva-checkins { display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.checkin-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.checkin-horario { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft); }
.checkin-status { font-size: 0.76rem; font-weight: 600; color: var(--ink-soft); }
.checkin-status.is-aguardando { font-weight: 500; }
.checkin-status.is-ok { color: var(--livre); }
.checkin-status.is-erro { color: var(--ocupado); }
.checkin-status.is-qr { color: var(--ink-soft); }
.modal-qr-card { max-width: 340px; text-align: center; }
.qr-imagem-wrap { display: flex; justify-content: center; margin: 4px 0 14px; }
.qr-imagem-wrap img { width: 260px; height: 260px; border-radius: 10px; border: 1px solid var(--border); background: #fff; }

.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 10px; }
.cal-titulo { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin: 0; min-width: 0; overflow-wrap: break-word; }
.cal-header .btn-ghost { width: 34px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; border-radius: 999px; }
.cal-legenda { display: flex; align-items: center; gap: 16px; font-size: 0.78rem; color: var(--ink-soft); margin: 10px 0 16px; }
.cal-legenda span { display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot-livre { background: var(--livre); }
.dot-parcial { background: var(--parcial); }
.dot-cheio { background: var(--ocupado); }
.cal-dias-semana { display: grid; grid-template-columns: repeat(7, 1fr); font-family: var(--font-body); font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; color: var(--ink-soft); margin-bottom: 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

.cal-dia { aspect-ratio: 1; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-body); font-weight: 700; font-size: 0.9rem; color: var(--ink); }
.cal-dia-vazio { border: none; background: transparent; box-shadow: none; }
.cal-dia-gauge { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.cal-dia.status-livre .cal-dia-gauge { background: var(--livre); animation: pulse-glow 2.6s ease-in-out infinite; }
.cal-dia.status-parcial .cal-dia-gauge { background: var(--parcial); }
.cal-dia.status-cheio .cal-dia-gauge { background: var(--ocupado); }
.cal-dia.status-cheio { color: var(--ocupado); }
.cal-dia.is-passado { opacity: 0.3; }
.cal-dia.is-hoje { border-color: var(--accent); border-width: 2px; }
.cal-dia:disabled { cursor: not-allowed; }
.cal-dia:not(:disabled):hover { border-color: var(--accent); transform: translateY(-1px); }

.slots-card { scroll-margin-top: 80px; }
.slots-card.is-hidden { display: none; }
.slots-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.slots-header h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin: 0; min-width: 0; overflow-wrap: break-word; }

.slots-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 16px 0; max-height: 420px; overflow-y: auto; }

.slot { width: 100%; max-width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: all .12s ease; text-align: left; min-width: 0; }
.slot-hora { font-family: var(--font-mono); font-weight: 600; font-size: 0.9rem; color: var(--ink); flex-shrink: 0; min-width: 92px; }
.slot-status { font-family: var(--font-body); font-weight: 600; font-size: 0.76rem; color: var(--livre); display: flex; align-items: center; gap: 6px; }
.slot-status::before { content: ""; width: 6px; height: 6px; min-width: 6px; border-radius: 50%; background: currentColor; }
.slot:not(:disabled):hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(15,23,42,0.06); transform: translateY(-1px); }
.slot:not(.slot-ocupado):not(.slot-meu) .slot-status::before { animation: pulse-glow 2.2s ease-in-out infinite; }
.slot-selecionado { background: var(--accent); border-color: var(--accent); }
.slot-selecionado .slot-hora, .slot-selecionado .slot-status { color: #fff; }
.slot-selecionado .slot-status::before { background: #fff; animation: none; }
.slot-ocupado { align-items: center; gap: 10px; background: var(--ocupado-bg); border-color: transparent; padding: 9px 14px; }
.slot-ocupado .slot-status { color: var(--ocupado); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-info { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.slot-email { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.slot-meu { align-items: center; gap: 10px; background: var(--parcial-bg); border-color: transparent; padding: 9px 14px; }
.slot-meu .slot-status { color: var(--parcial); }
.slot:disabled { opacity: 0.6; }

.btn-pedir { flex-shrink: 0; border: none; background: none; color: var(--ink-soft); padding: 0; font-size: 0.74rem; font-weight: 500; white-space: nowrap; text-decoration: underline; text-decoration-color: transparent; opacity: 0.85; }
.btn-pedir:hover { text-decoration-color: var(--ink-soft); opacity: 1; }
.btn-cancelar-slot { color: var(--ocupado); font-weight: 600; }
.btn-cancelar-slot:hover { text-decoration-color: var(--ocupado); }

.solicitacoes-card.is-hidden { display: none; }
.solicitacoes-card h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; margin: 0 0 14px; }
.solicitacao-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.solicitacao-item:last-child { margin-bottom: 0; }
.solicitacao-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
.solicitacao-quem { font-weight: 700; font-size: 0.92rem; }
.solicitacao-email { font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-soft); }
.solicitacao-quando { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft); }
.solicitacao-motivo { margin: 4px 0 0; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
.solicitacao-status { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-body); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 4px; padding: 3px 10px; border-radius: 999px; }
.solicitacao-status.is-pendente { background: var(--parcial-bg); color: var(--parcial); }
.solicitacao-status.is-ok { background: var(--livre-bg); color: var(--livre); }
.solicitacao-status.is-erro { background: var(--ocupado-bg); color: var(--ocupado); }
.solicitacao-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-sm { padding: 8px 14px; font-size: 0.85rem; width: auto; margin-top: 0; }

.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.45); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.modal-overlay.is-hidden { display: none; }
.modal-card { width: 100%; max-width: 420px; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 24px 48px -12px rgba(15,23,42,0.28); }
.modal-card h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin: 0 0 6px; }
.modal-info { font-size: 0.88rem; color: var(--ink-soft); margin: 0 0 16px; }
.modal-card textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem; font-family: var(--font-body); background: var(--bg); color: var(--ink); resize: vertical; }
.modal-card textarea:focus { border-color: var(--accent); background: var(--surface); }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions .btn { width: auto; flex: 1; margin-top: 0; }

@media (max-width: 420px) {
  .cal-dia-num { font-size: 0.82rem; }
}
</style>
</head>
<body>

<div id="tela-auth" class="auth-body">
  <main class="auth-wrap">
    <div class="plaque">
      <div class="plaque-pin"></div>
      <h1 class="plaque-title">Sala de Reunião</h1>
      <p class="plaque-sub">Reserve o seu horário</p>
    </div>

    <div class="card auth-card">
      <div class="tabs" role="tablist">
        <button class="tab is-active" id="tab-login" role="tab" aria-selected="true">Entrar</button>
        <button class="tab" id="tab-cadastro" role="tab" aria-selected="false">Cadastrar</button>
      </div>

      <form id="form-login" class="auth-form" autocomplete="on">
        <label class="field"><span>E-mail</span>
          <input type="email" id="login-email" required placeholder="e-mail">
        </label>
        <label class="field"><span>Senha</span>
          <input type="password" id="login-senha" required placeholder="••••••••" minlength="6">
        </label>
        <button type="submit" class="btn btn-primary">Entrar</button>
        <button type="button" id="btn-esqueci-senha" class="link-esqueci-senha">Esqueceu a senha?</button>
        <p class="form-msg" id="login-msg" role="alert"></p>
      </form>

      <form id="form-cadastro" class="auth-form is-hidden" autocomplete="on">
        <label class="field"><span>Nome</span>
          <input type="text" id="cad-nome" required placeholder="Seu nome">
        </label>
        <label class="field"><span>E-mail</span>
          <input type="email" id="cad-email" required placeholder="e-mail">
        </label>
        <label class="field"><span>Senha</span>
          <input type="password" id="cad-senha" required placeholder="Mínimo 6 caracteres" minlength="6">
        </label>
        <button type="submit" class="btn btn-primary">Criar conta</button>
        <p class="form-msg" id="cadastro-msg" role="alert"></p>
      </form>
    </div>
  </main>
  <p class="auth-creditos">Desenvolvido por Jonata &amp; Ricardo</p>
</div>

<div id="tela-dashboard" class="is-hidden">
  <header class="topbar">
    <div class="topbar-brand"><span class="pin-dot"></span><span>Sala de Reunião</span></div>
    <div class="topbar-user">
      <span id="user-nome">—</span>
      <button id="btn-qr-checkin" class="btn btn-ghost" title="Gerar QR code de check-in para colar na porta da sala">QR check-in</button>
      <button id="btn-sair" class="btn btn-ghost">Sair</button>
    </div>
  </header>

  <main class="dash-wrap">
    <section class="card minha-reserva" id="minha-reserva"></section>

    <section class="card solicitacoes-card is-hidden" id="solicitacoes-recebidas-card">
      <h3>Solicitações recebidas</h3>
      <div id="solicitacoes-recebidas-lista"></div>
    </section>

    <section class="card solicitacoes-card is-hidden" id="solicitacoes-enviadas-card">
      <h3>Suas solicitações enviadas</h3>
      <div id="solicitacoes-enviadas-lista"></div>
    </section>

    <div class="cal-slots-sticky-wrap">
    <div class="cal-slots-row">
      <section class="card calendario-card">
        <div class="cal-header">
          <button id="mes-anterior" class="btn btn-ghost" aria-label="Mês anterior">‹</button>
          <h2 id="mes-atual" class="cal-titulo">—</h2>
          <button id="mes-seguinte" class="btn btn-ghost" aria-label="Próximo mês">›</button>
        </div>
        <div class="cal-legenda">
          <span><i class="dot dot-livre"></i> livre</span>
          <span><i class="dot dot-parcial"></i> parcial</span>
          <span><i class="dot dot-cheio"></i> lotada</span>
        </div>
        <div class="cal-dias-semana"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
        <div class="cal-grid" id="cal-grid"></div>
      </section>

      <section class="card slots-card is-hidden" id="slots-card">
        <div class="slots-header">
          <h3 id="slots-titulo">Horários — —</h3>
          <button id="fechar-slots" class="btn btn-ghost">Fechar</button>
        </div>

        <div class="slots-grid" id="slots-grid"></div>
        <button id="btn-confirmar" class="btn btn-primary" disabled>Confirmar reserva</button>
        <p class="form-msg" id="slots-msg" role="alert"></p>
      </section>
    </div>
    </div>
  </main>
</div>

<div id="modal-overlay" class="modal-overlay is-hidden">
  <div class="card modal-card">
    <h3>Solicitar horário</h3>
    <p class="modal-info" id="modal-info"></p>
    <label class="field"><span>Explique por que você quer esse horário</span>
      <textarea id="modal-motivo" rows="4" placeholder="Ex: preciso fazer uma reunião urgente com o time nesse horário..."></textarea>
    </label>
    <p class="form-msg" id="modal-msg" role="alert"></p>
    <div class="modal-actions">
      <button type="button" id="modal-cancelar" class="btn btn-ghost">Cancelar</button>
      <button type="button" id="modal-enviar" class="btn btn-primary">Enviar pedido</button>
    </div>
  </div>
</div>

<div id="modal-recusa-overlay" class="modal-overlay is-hidden">
  <div class="card modal-card">
    <h3>Recusar pedido</h3>
    <p class="modal-info" id="modal-recusa-info"></p>
    <label class="field"><span>Motivo da recusa (opcional)</span>

function paraChaveData(date) {

  return `${y}-${m}-${d}`;

function hojeChave() { return paraChaveData(new Date()); }
function formatarDataBR(chave) { const [y,m,d] = chave.split("-"); return `${d}/${m}/${y}`; }
function minutosParaLabel(min) {

  const m = String(min % 60).padStart(2, "0");
  return `${h}:${m}`;

const NOMES_MES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const LIMITE_DIAS_RESERVADOS = 3;

// --- Check-in por QR code + localização ---
// Geolocalização sozinha (via navegador) não é confiável o suficiente em
// desktop (erro de várias centenas de metros ou mais). Por isso a prova de
// presença combina duas coisas:
// 1) Escanear o QR code fixado na porta da sala com a câmera do celular
//    (abre esta mesma página com ?checkin=<token> na URL) — isso já exige
//    estar fisicamente diante da porta;
// 2) Confirmar com o GPS do celular (bem mais preciso que o de um PC) que a
//    localização no momento do scan está mesmo perto da sala.
// Só quando as duas condições batem o check-in é confirmado.
const CHECKIN_JANELA_MIN = 60;     // check-in libera X minutos antes do início
const CHECKIN_QR_PARAM = "checkin";
const CHECKIN_QR_TOKEN = "sala-reuniao-presenca"; // troque por um valor único se quiser gerar um novo QR
const SALA_LAT = -10.919539;   // troque pela latitude real da sala
const SALA_LNG = -37.664218;   // troque pela longitude real da sala
const CHECKIN_RAIO_METROS = 120;   // tolerância de precisão do GPS

function formatarHoraLocal(date) {
  return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
}

function distanciaMetros(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function obterLocalizacaoAtual() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject({ code: "sem-suporte" }); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(pos.coords),
      (err) => reject(err),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

function linkCheckinQr() {
  const url = new URL(location.origin + location.pathname);
  url.searchParams.set(CHECKIN_QR_PARAM, CHECKIN_QR_TOKEN);
  return url.toString();
}

// Guarda (e limpa da URL) um token de check-in vindo de ?checkin=..., caso a
// página tenha sido aberta escaneando o QR code. Roda assim que o script
// carrega, antes mesmo do login terminar, para não perder o parâmetro.
(function capturarCheckinDaUrl() {
  try {
    const params = new URLSearchParams(location.search);
    const token = params.get(CHECKIN_QR_PARAM);
    if (!token) return;
    sessionStorage.setItem("checkinPendente", token);
    params.delete(CHECKIN_QR_PARAM);
    const resto = params.toString();
    const novaUrl = location.pathname + (resto ? `?${resto}` : "") + location.hash;
    history.replaceState({}, "", novaUrl);
  } catch (e) { /* sessionStorage indisponível: apenas ignora */ }
})();

// Confirma o check-in de um grupo de horários, registrando também a
// localização usada para validar a proximidade da sala.
async function confirmarCheckinGrupo(dia, ini, fim, coords, dist) {
  const snap = await db.collection("bookings")
    .where("date", "==", dia)
    .where("userId", "==", usuarioAtual.uid)
    .where("startMinutes", ">=", ini)
    .where("startMinutes", "<", fim)
    .get();
  const batch = db.batch();
  snap.docs.forEach((doc) => {
    batch.update(doc.ref, {
      checkinStatus: "confirmado",
      checkinEm: firebase.firestore.FieldValue.serverTimestamp(),
      checkinVia: "qr",
      checkinLat: coords.latitude,
      checkinLng: coords.longitude,
      checkinDistanciaM: Math.round(dist)
    });
  });
  await batch.commit();
}

// Processa um token de check-in pendente (guardado ao escanear o QR code).
// Se houver reserva de hoje dentro da janela de check-in, pede a localização
// do celular e só confirma se ela estiver perto o suficiente da sala.
async function processarCheckinPendente() {
  const token = sessionStorage.getItem("checkinPendente");
  if (!token) return;
  sessionStorage.removeItem("checkinPendente");

  if (token !== CHECKIN_QR_TOKEN) {
    alert("Esse QR code de check-in não é válido.");
    return;
  }

  const hoje = hojeChave();
  const agora = new Date();
  const minhas = await buscarReservasDoUsuario();
  const reservasHoje = minhas.filter(r => r.date === hoje).sort((a, b) => a.startMinutes - b.startMinutes);
  if (reservasHoje.length === 0) {
    alert("Você não tem nenhuma reserva para hoje nessa sala.");
    return;
  }

  const grupos = agruparBlocos(reservasHoje.map(r => r.startMinutes));
  const candidatos = grupos.filter(([ini]) => {
    const repDoc = reservasHoje.find(r => r.startMinutes === ini);
    if (repDoc && repDoc.checkinStatus === "confirmado") return false;
    const inicioDate = new Date(`${hoje}T${minutosParaLabel(ini)}:00`);
    const janelaAbre = new Date(inicioDate.getTime() - CHECKIN_JANELA_MIN * 60000);
    return agora >= janelaAbre && agora < inicioDate;
  });

  if (candidatos.length === 0) {
    alert("Nenhum check-in disponível agora. Verifique se o horário da sua reserva já está dentro da janela de check-in.");
    return;
  }

  let coords;
  try {
    coords = await obterLocalizacaoAtual();
  } catch (err) {
    let msg = "Não foi possível obter sua localização para confirmar o check-in. Escaneie o QR code novamente.";
    if (err && err.code === 1) msg = "Permissão de localização negada. Ative-a e escaneie o QR code novamente.";
    else if (err && err.code === 3) msg = "Tempo esgotado ao obter localização. Escaneie o QR code novamente.";
    else if (err && err.code === "sem-suporte") msg = "Seu celular/navegador não suporta localização, então não é possível confirmar o check-in.";
    alert(msg);
    return;
  }

  const dist = distanciaMetros(coords.latitude, coords.longitude, SALA_LAT, SALA_LNG);
  if (dist > CHECKIN_RAIO_METROS) {
    alert(`Você está a aproximadamente ${Math.round(dist)}m da sala, então o check-in foi bloqueado. Aproxime-se e escaneie o QR code novamente.`);
    return;
  }

  for (const [ini, fim] of candidatos) {
    await confirmarCheckinGrupo(hoje, ini, fim, coords, dist);
  }
  invalidarCacheReservas();
  await carregarMinhaReserva();
  alert(candidatos.length === 1 ? "Check-in confirmado! Presença registrada." : "Check-in confirmado para seus horários de hoje!");
}

async function buscarReservasDoUsuario() {
  if (minhasReservasCache) return minhasReservasCache;
  const snap = await db.collection("bookings").where("userId", "==", usuarioAtual.uid).get();
  minhasReservasCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  return minhasReservasCache;
}

// Libera (exclui) blocos de reserva de HOJE cujo check-in não foi feito até o horário de início.
// Recebe uma lista de docs de "bookings" (com id) de um ou mais usuários.
async function liberarReservasExpiradas(docs) {
  if (!docs || docs.length === 0) return false;
  const agora = new Date();
  const hoje = hojeChave();
  const porUsuarioDia = {};
  docs.forEach((r) => {
    if (r.date !== hoje) return;
    const chave = `${r.date}|${r.userId}`;
    (porUsuarioDia[chave] = porUsuarioDia[chave] || []).push(r);
  });

  const idsParaExcluir = [];
  Object.values(porUsuarioDia).forEach((lista) => {
    lista.sort((a, b) => a.startMinutes - b.startMinutes);
    const grupos = agruparBlocos(lista.map(r => r.startMinutes));
    grupos.forEach(([ini, fim]) => {
      const doGrupo = lista.filter(r => r.startMinutes >= ini && r.startMinutes < fim);
      const jaConfirmado = doGrupo.some(r => r.checkinStatus === "confirmado");
      if (jaConfirmado) return;
      const inicioDate = new Date(`${hoje}T${minutosParaLabel(ini)}:00`);
      if (agora >= inicioDate) doGrupo.forEach(r => idsParaExcluir.push(r.id));
    });
  });

  if (idsParaExcluir.length === 0) return false;
  try {
    const batch = db.batch();
    idsParaExcluir.forEach(id => batch.delete(db.collection("bookings").doc(id)));
    await batch.commit();
    return true;
  } catch (err) {
    console.warn("Não foi possível liberar automaticamente reservas sem check-in (verifique as regras de segurança do Firestore):", err);
    return false;
  }
}

async function obterDiasReservados() {
  const minhas = await buscarReservasDoUsuario();
  const hoje = hojeChave();
  const datas = [...new Set(minhas.filter(r => r.date >= hoje).map(r => r.date))];
  datas.sort();
  return datas;
}

async function podeReservarNoDia(chave) {
  const dias = await obterDiasReservados();
  if (dias.includes(chave)) return true;
  return dias.length < LIMITE_DIAS_RESERVADOS;
}

function agruparBlocos(minutosOrdenados) {
  const grupos = [];
  let atualIni = null, atualFim = null;
  minutosOrdenados.forEach((m) => {
    if (atualIni === null) { atualIni = m; atualFim = m + PASSO_MIN; return; }
    if (m === atualFim) { atualFim = m + PASSO_MIN; }
    else { grupos.push([atualIni, atualFim]); atualIni = m; atualFim = m + PASSO_MIN; }
  });
  if (atualIni !== null) grupos.push([atualIni, atualFim]);
  return grupos;
}

async function carregarMinhaReserva() {
  const box = document.getElementById("minha-reserva");
  let minhas = await buscarReservasDoUsuario();
  const liberou = await liberarReservasExpiradas(minhas);
  if (liberou) {
    invalidarCacheReservas();
    minhas = await buscarReservasDoUsuario();
  }
  const dias = await obterDiasReservados();
  if (dias.length === 0) {
    box.innerHTML = `<p class="minha-reserva-vazia">Você ainda não tem nenhuma sala marcada. Escolha um dia no calendário abaixo.</p>`;
    return;
  }

  const agora = new Date();
  const hoje = hojeChave();

  const cardsHtml = dias.map((dia) => {
    const reservasDoDia = minhas.filter(r => r.date === dia).sort((a, b) => a.startMinutes - b.startMinutes);
    const horariosDoDia = reservasDoDia.map(r => r.startMinutes);
    const grupos = agruparBlocos(horariosDoDia);
    const horariosTxt = grupos.map(([ini, fim]) => `${minutosParaLabel(ini)}–${minutosParaLabel(fim)}`).join(", ");

    let checkinsHtml = "";
    if (dia === hoje) {
      checkinsHtml = grupos.map(([ini, fim]) => {
        const repDoc = reservasDoDia.find(r => r.startMinutes === ini);
        const inicioDate = new Date(`${dia}T${minutosParaLabel(ini)}:00`);
        const janelaAbre = new Date(inicioDate.getTime() - CHECKIN_JANELA_MIN * 60000);
        const label = `${minutosParaLabel(ini)}–${minutosParaLabel(fim)}`;
        const jaConfirmado = repDoc && repDoc.checkinStatus === "confirmado";

        // A janela de check-in vai de "janelaAbre" até "inicioDate": a reserva
        // é liberada automaticamente (liberarReservasExpiradas) no exato
        // horário de início caso não tenha sido confirmada, então depois
        // disso não faz sentido oferecer o botão — a sala já pode ter sido
        // repassada a outra pessoa.
        let statusHtml;
        if (jaConfirmado) {
          statusHtml = `<span class="checkin-status is-ok">✓ Check-in feito</span>`;
        } else if (agora < janelaAbre) {
          statusHtml = `<span class="checkin-status is-aguardando">Check-in libera às ${formatarHoraLocal(janelaAbre)}</span>`;
        } else if (agora >= inicioDate) {
          statusHtml = `<span class="checkin-status is-erro">Check-in não realizado</span>`;
        } else {
          statusHtml = `<span class="checkin-status is-qr">📷 Escaneie o QR code na porta da sala para confirmar presença (o app vai pedir sua localização)</span>`;
        }

        return `<div class="checkin-item"><span class="checkin-horario">${label}</span>${statusHtml}</div>`;
      }).join("");
    }

    return `
      <div class="reserva-atual">
        <div class="reserva-atual-top">
          <div class="reserva-atual-info">
            <span class="reserva-atual-data">${formatarDataBR(dia)}</span>
            <span class="reserva-atual-horarios">${horariosTxt}</span>
          </div>
          <button class="btn-cancelar-dia" data-cancelar-dia="${dia}" title="Cancelar todas as reservas deste dia" aria-label="Cancelar todas as reservas deste dia">✕</button>
        </div>
        ${checkinsHtml ? `<div class="reserva-checkins">${checkinsHtml}</div>` : ""}
      </div>`;
  }).join("");

  const avisoLimite = dias.length >= LIMITE_DIAS_RESERVADOS
    ? `Você atingiu o limite de ${LIMITE_DIAS_RESERVADOS} dias reservados. Cancele um deles ou espere um passar para marcar outro dia.`
    : `Você pode reservar até ${LIMITE_DIAS_RESERVADOS} dias diferentes ao mesmo tempo (já usou ${dias.length} de ${LIMITE_DIAS_RESERVADOS}).`;

  box.innerHTML = `<span class="minha-reserva-label">Salas reservadas</span><div class="reserva-lista">${cardsHtml}</div><p class="reserva-atual-aviso">${avisoLimite}</p>`;
  box.querySelectorAll("[data-cancelar-dia]").forEach((btn) => {
    btn.addEventListener("click", () => cancelarReservasDoDia(btn.dataset.cancelarDia));
  });
}

async function cancelarHorarioIndividual(chaveData, startMinutes) {
  const label = `${minutosParaLabel(startMinutes)}–${minutosParaLabel(startMinutes + PASSO_MIN)}`;
  const ok = await confirmarAcao(`Cancelar o horário de ${label} do dia ${formatarDataBR(chaveData)}?`, "Cancelar horário");
  if (!ok) return;
  try {
    await db.collection("bookings").doc(`${chaveData}_${startMinutes}`).delete();
    invalidarCacheReservas();
    await carregarMinhaReserva();
  } catch (err) {
    console.error("Erro ao cancelar horário:", err);
    alert(err.message || "Não foi possível cancelar este horário. Tente novamente.");
  }
}

async function cancelarReservasDoDia(chaveData) {
  const ok = await confirmarAcao(`Cancelar todas as suas reservas do dia ${formatarDataBR(chaveData)}?`, "Cancelar reservas do dia");
  if (!ok) return;
  try {
    const snap = await db.collection("bookings").where("userId", "==", usuarioAtual.uid).where("date", "==", chaveData).get();
    if (snap.empty) {
      console.warn("Nenhuma reserva encontrada para cancelar em", chaveData, "com userId", usuarioAtual.uid);
    }
    const batch = db.batch();
    snap.docs.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
    invalidarCacheReservas();
    await carregarMinhaReserva();
  } catch (err) {
    console.error("Erro ao cancelar reservas do dia:", err);
    alert(err.message || "Não foi possível cancelar as reservas deste dia. Tente novamente.");
  }
}

function renderizarCalendario() {
  document.getElementById("mes-atual").textContent = `${NOMES_MES[mesExibido.getMonth()]} ${mesExibido.getFullYear()}`;
  const primeiroDia = new Date(mesExibido.getFullYear(), mesExibido.getMonth(), 1);
  const ultimoDia = new Date(mesExibido.getFullYear(), mesExibido.getMonth() + 1, 0);
  const mesChaveAtual = chaveDoMes(mesExibido);
  const chaveInicio = paraChaveData(primeiroDia);
  const chaveFim = paraChaveData(ultimoDia);

  pararEscutaCalendario();
  unsubCalendario = db.collection("bookings")
    .where("date", ">=", chaveInicio)
    .where("date", "<=", chaveFim)
    .onSnapshot((snap) => {
      const docsComId = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const ocupacaoPorDia = {};
      docsComId.forEach((data) => {
        ocupacaoPorDia[data.date] = (ocupacaoPorDia[data.date] || 0) + 1;
      });
      calendarioCache = { mesChave: mesChaveAtual, ocupacaoPorDia };
      desenharGradeCalendario(primeiroDia, ultimoDia);
      ultimoSnapCalendarioDocs = docsComId;
      // Observação: a limpeza de reservas expiradas NÃO roda mais aqui.
      // Antes ela rodava a cada atualização deste listener, em todo cliente
      // conectado — e como ela mesma pode apagar documentos, cada exclusão
      // reacionava o listener de todo mundo de novo (efeito cascata de
      // leituras/escritas). Agora a limpeza roda só no intervalo de 60s
      // (uma vez, não por cliente-evento) e no listener do dia aberto.
    }, (err) => console.error("Erro ao ouvir o calendário:", err));
}

function desenharGradeCalendario(primeiroDia, ultimoDia) {
  const totalSlots = (HORARIO_FIM_MIN - HORARIO_INICIO_MIN) / PASSO_MIN;
  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";
  for (let i = 0; i < primeiroDia.getDay(); i++) grid.appendChild(criarCelulaVazia());

  const hoje = hojeChave();
  for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
    const dataObj = new Date(primeiroDia.getFullYear(), primeiroDia.getMonth(), dia);
    const chave = paraChaveData(dataObj);
    const ocupados = calendarioCache.ocupacaoPorDia[chave] || 0;
    const isPassado = chave < hoje;
    const lotado = ocupados >= totalSlots;
    let status = "livre";
    if (ocupados > 0 && !lotado) status = "parcial";
    if (lotado) status = "cheio";
    grid.appendChild(criarCelulaDia(dia, chave, status, isPassado));
  }
}

function criarCelulaVazia() {
  const el = document.createElement("div");
  el.className = "cal-dia cal-dia-vazio";
  return el;
}
function criarCelulaDia(numero, chave, status, isPassado) {
  const el = document.createElement("button");
  el.className = `cal-dia status-${status}`;
  if (isPassado) el.classList.add("is-passado");
  if (chave === hojeChave()) el.classList.add("is-hoje");
  el.disabled = isPassado;
  el.innerHTML = `<span class="cal-dia-num">${numero}</span><span class="cal-dia-gauge"></span>`;
  el.addEventListener("click", () => abrirDia(chave));
  return el;
}

const slotsCard = document.getElementById("slots-card");
const slotsGrid = document.getElementById("slots-grid");
const slotsMsg = document.getElementById("slots-msg");
const btnConfirmar = document.getElementById("btn-confirmar");

let unsubDiaAtual = null;
function pararEscutaDia() {
  if (unsubDiaAtual) unsubDiaAtual();
  unsubDiaAtual = null;
}

document.getElementById("fechar-slots").addEventListener("click", () => {
  slotsCard.classList.add("is-hidden");

});

async function abrirDia(chave) {
  diaSelecionado = chave;
  horariosSelecionados = [];
  slotsMsg.textContent = "";
  document.getElementById("slots-titulo").textContent = `Horários — ${formatarDataBR(chave)}`;
  slotsCard.classList.remove("is-hidden");
  slotsCard.scrollIntoView({ behavior: "smooth", block: "start" });

  pararEscutaDia();
  unsubDiaAtual = db.collection("bookings").where("date", "==", chave)
    .onSnapshot(async (snap) => {
      const docsComId = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      horariosOcupadosDoDia = docsComId.map(d => d.startMinutes);
      meusBlocosDoDia = docsComId.filter(d => d.userId === usuarioAtual.uid).map(d => d.startMinutes);
      ocupacaoDetalhe = {};
      docsComId.forEach((data) => {
        ocupacaoDetalhe[data.startMinutes] = { userNome: data.userNome || data.userEmail, userEmail: data.userEmail, userId: data.userId };
      });

      if (chave === hojeChave()) await liberarReservasExpiradas(docsComId);

      const podeReservar = await podeReservarNoDia(chave);
      const bloqueadoPorLimite = !podeReservar;
      renderizarSlots(bloqueadoPorLimite);
    }, (err) => console.error("Erro ao ouvir horários do dia:", err));
}

function renderizarSlots(bloqueadoPorLimite) {
  slotsGrid.innerHTML = "";
  for (let m = HORARIO_INICIO_MIN; m < HORARIO_FIM_MIN; m += PASSO_MIN) {
    const ocupado = horariosOcupadosDoDia.includes(m);
    const meu = meusBlocosDoDia.includes(m);

    if (ocupado && !meu) {
      const detalhe = ocupacaoDetalhe[m];
      const nomeDono = detalhe ? detalhe.userNome : "ocupado";
      const emailDono = detalhe ? detalhe.userEmail : "";
      const div = document.createElement("div");
      div.className = "slot slot-ocupado";
      div.dataset.min = m;
      div.innerHTML = `
        <span class="slot-hora">${minutosParaLabel(m)}–${minutosParaLabel(m + PASSO_MIN)}</span>
        <span class="slot-info">
          <span class="slot-status">${escaparHTML(nomeDono)}</span>
          ${emailDono ? `<span class="slot-email">${escaparHTML(emailDono)}</span>` : ""}
        </span>
        ${(bloqueadoPorLimite || !detalhe) ? "" : `<button type="button" class="btn-pedir" data-pedir="${m}">pedir esse horário</button>`}`;
      slotsGrid.appendChild(div);
      continue;
    }

    if (meu) {
      const div = document.createElement("div");
      div.className = "slot slot-meu";
      div.dataset.min = m;
      div.innerHTML = `
        <span class="slot-hora">${minutosParaLabel(m)}–${minutosParaLabel(m + PASSO_MIN)}</span>
        <span class="slot-status">sua reserva</span>
        <button type="button" class="btn-pedir btn-cancelar-slot" data-cancelar-meu="${m}">cancelar este horário</button>`;
      slotsGrid.appendChild(div);
      continue;
    }

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "slot";
    btn.dataset.min = m;
    btn.disabled = bloqueadoPorLimite;
    btn.innerHTML = `
      <span class="slot-hora">${minutosParaLabel(m)}–${minutosParaLabel(m + PASSO_MIN)}</span>
      <span class="slot-status">livre</span>`;
    if (!bloqueadoPorLimite) btn.addEventListener("click", () => alternarSelecao(m, btn));
    slotsGrid.appendChild(btn);
  }

  slotsGrid.querySelectorAll("[data-pedir]").forEach((btnPedir) => {
    btnPedir.addEventListener("click", (e) => {
      e.stopPropagation();
      const m = parseInt(btnPedir.dataset.pedir, 10);
      const detalhe = ocupacaoDetalhe[m];
      if (!detalhe) return;
      abrirModalSolicitacao(diaSelecionado, m, detalhe.userId, detalhe.userNome);
    });
  });

  slotsGrid.querySelectorAll("[data-cancelar-meu]").forEach((btnCancelar) => {
    btnCancelar.addEventListener("click", (e) => {
      e.stopPropagation();
      const m = parseInt(btnCancelar.dataset.cancelarMeu, 10);
      cancelarHorarioIndividual(diaSelecionado, m);
    });
  });

  if (bloqueadoPorLimite) {
    slotsMsg.className = "form-msg is-erro";
    slotsMsg.textContent = `Você já atingiu o limite de ${LIMITE_DIAS_RESERVADOS} dias reservados. Cancele algum deles para poder marcar este dia.`;
  } else {
    slotsMsg.textContent = "";
  }
  btnConfirmar.disabled = true;
}

function alternarSelecao(m, btn) {
  const idx = horariosSelecionados.indexOf(m);
  if (idx >= 0) { horariosSelecionados.splice(idx, 1); btn.classList.remove("slot-selecionado"); }
  else { horariosSelecionados.push(m); btn.classList.add("slot-selecionado"); }
  btnConfirmar.disabled = horariosSelecionados.length === 0;
  slotsMsg.textContent = "";
}

btnConfirmar.addEventListener("click", async () => {
  if (horariosSelecionados.length === 0 || !diaSelecionado) return;
  btnConfirmar.disabled = true;
  slotsMsg.className = "form-msg";
  slotsMsg.textContent = "Confirmando...";

  try {
    const podeReservar = await podeReservarNoDia(diaSelecionado);
    if (!podeReservar) {
      throw new Error(`Você já atingiu o limite de ${LIMITE_DIAS_RESERVADOS} dias reservados. Cancele algum deles para marcar este dia.`);
    }

    await db.runTransaction(async (tx) => {
      const refs = horariosSelecionados.map(m => db.collection("bookings").doc(`${diaSelecionado}_${m}`));
      const snaps = await Promise.all(refs.map(ref => tx.get(ref)));
      snaps.forEach((snap, i) => {
        if (snap.exists) throw new Error(`O horário ${minutosParaLabel(horariosSelecionados[i])} acabou de ser reservado por outra pessoa. Escolha outro.`);
      });
      refs.forEach((ref, i) => {
        tx.set(ref, {
          date: diaSelecionado,
          startMinutes: horariosSelecionados[i],
          userId: usuarioAtual.uid,
          userEmail: usuarioAtual.email,
          userNome: usuarioAtual.displayName || usuarioAtual.email,
          criadoEm: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
    });

    slotsMsg.className = "form-msg is-ok";
    slotsMsg.textContent = "Reserva confirmada!";
    invalidarCacheReservas();
    await carregarMinhaReserva();

    horariosSelecionados = [];
    btnConfirmar.disabled = true;
  } catch (err) {
    slotsMsg.className = "form-msg is-erro";
    slotsMsg.textContent = err.message || "Não foi possível confirmar. Tente novamente.";
    btnConfirmar.disabled = false;
  }
});

function confirmarAcao(mensagem, titulo = "Confirmar ação") {
  return new Promise((resolve) => {
    const overlay = document.getElementById("confirm-overlay");
    const btnConfirmar = document.getElementById("confirm-confirmar");
    const btnCancelar = document.getElementById("confirm-cancelar");
    document.getElementById("confirm-titulo").textContent = titulo;
    document.getElementById("confirm-mensagem").textContent = mensagem;
    overlay.classList.remove("is-hidden");

    function limpar(resultado) {
      overlay.classList.add("is-hidden");
      btnConfirmar.removeEventListener("click", onConfirmar);
      btnCancelar.removeEventListener("click", onCancelar);
      overlay.removeEventListener("click", onOverlayClick);
      resolve(resultado);
    }
    function onConfirmar() { limpar(true); }
    function onCancelar() { limpar(false); }
    function onOverlayClick(e) { if (e.target === overlay) limpar(false); }

    btnConfirmar.addEventListener("click", onConfirmar);
    btnCancelar.addEventListener("click", onCancelar);
    overlay.addEventListener("click", onOverlayClick);
  });
}

function escaparHTML(texto) {
  const div = document.createElement("div");

const transferenciasEmAndamento = new Set();

async function concluirTransferencia(id, r) {
  if (transferenciasEmAndamento.has(id)) return;
  transferenciasEmAndamento.add(id);
  try {
    const podeReservar = await podeReservarNoDia(r.date);
    if (!podeReservar) {

      return;
    }

    const bookingRef = db.collection("bookings").doc(`${r.date}_${r.startMinutes}`);
    const reqRef = db.collection("requests").doc(id);
    await db.runTransaction(async (tx) => {
      const bookingSnap = await tx.get(bookingRef);
      if (bookingSnap.exists) throw new Error("Esse horário já foi ocupado.");
      tx.set(bookingRef, {
        date: r.date,
        startMinutes: r.startMinutes,
        userId: usuarioAtual.uid,
        userEmail: usuarioAtual.email,
        userNome: usuarioAtual.displayName || usuarioAtual.email,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });
      tx.update(reqRef, { status: "concluida", concluidoEm: firebase.firestore.FieldValue.serverTimestamp() });
    });

    invalidarCacheReservas();
    await carregarMinhaReserva();

  } catch (err) {
    console.error("Não foi possível concluir a transferência:", err.message);
  } finally {
    transferenciasEmAndamento.delete(id);
  }
}

async function aceitarSolicitacao(id) {
  const msgEl = document.getElementById(`solmsg-${id}`);
  if (msgEl) { msgEl.className = "form-msg"; msgEl.textContent = "Processando..."; }
  let dataAfetada = null;
  try {
    const reqRef = db.collection("requests").doc(id);
    await db.runTransaction(async (tx) => {
      const reqSnap = await tx.get(reqRef);
      if (!reqSnap.exists) throw new Error("Esse pedido não existe mais.");
      const r = reqSnap.data();
      if (r.status !== "pendente") throw new Error("Esse pedido já foi respondido.");

      const bookingRef = db.collection("bookings").doc(`${r.date}_${r.startMinutes}`);
      const bookingSnap = await tx.get(bookingRef);
      if (!bookingSnap.exists || bookingSnap.data().userId !== usuarioAtual.uid) {
        throw new Error("Esse horário não está mais reservado com você.");
      }

      tx.delete(bookingRef);
      tx.update(reqRef, { status: "aceita", respondidoEm: firebase.firestore.FieldValue.serverTimestamp() });
      dataAfetada = r.date;
    });

    invalidarCacheReservas();
    await carregarMinhaReserva();

  } catch (err) {
    if (msgEl) { msgEl.className = "form-msg is-erro"; msgEl.textContent = err.message || "Não foi possível aceitar."; }
  }
}

async function recusarSolicitacao(id, motivoRecusa = "") {
  const msgEl = document.getElementById(`solmsg-${id}`);
  if (msgEl) { msgEl.className = "form-msg"; msgEl.textContent = "Processando..."; }
  try {
    const dados = {
      status: "recusada",
      respondidoEm: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (motivoRecusa) dados.motivoRecusa = motivoRecusa;
    await db.collection("requests").doc(id).update(dados);
  } catch (err) {
    if (msgEl) { msgEl.className = "form-msg is-erro"; msgEl.textContent = "Não foi possível recusar. Tente novamente."; }
    throw err;
  }
}

let recusaAtual = null;
const modalRecusaOverlay = document.getElementById("modal-recusa-overlay");
const modalRecusaInfo = document.getElementById("modal-recusa-info");
const modalRecusaMotivo = document.getElementById("modal-recusa-motivo");
const modalRecusaMsg = document.getElementById("modal-recusa-msg");
const btnModalRecusaEnviar = document.getElementById("modal-recusa-enviar");

function abrirModalRecusa(id, deUserNome) {
  recusaAtual = id;
  modalRecusaInfo.textContent = `Você está recusando o pedido de ${deUserNome}. Se quiser, explique o motivo abaixo.`;
  modalRecusaMotivo.value = "";
  modalRecusaMsg.textContent = "";
  modalRecusaMsg.className = "form-msg";
  btnModalRecusaEnviar.disabled = false;
  modalRecusaOverlay.classList.remove("is-hidden");
  modalRecusaMotivo.focus();
}
function fecharModalRecusa() {
  modalRecusaOverlay.classList.add("is-hidden");
  recusaAtual = null;
}
document.getElementById("modal-recusa-cancelar").addEventListener("click", fecharModalRecusa);
modalRecusaOverlay.addEventListener("click", (e) => { if (e.target === modalRecusaOverlay) fecharModalRecusa(); });

btnModalRecusaEnviar.addEventListener("click", async () => {
  if (!recusaAtual) return;
  const id = recusaAtual;
  const motivo = modalRecusaMotivo.value.trim();
  btnModalRecusaEnviar.disabled = true;
  modalRecusaMsg.className = "form-msg";
  modalRecusaMsg.textContent = "Enviando...";
  try {
    await recusarSolicitacao(id, motivo);
    fecharModalRecusa();
  } catch (err) {
    modalRecusaMsg.className = "form-msg is-erro";
    modalRecusaMsg.textContent = err.message || "Não foi possível recusar. Tente novamente.";
    btnModalRecusaEnviar.disabled = false;
  }
});
</script>
